  <meta name="theme-color" content="#080611">

  <style>
    :root {

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;

      margin: 0;
      background: var(--bg);
      color: var(--white);

    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {

    }

    .wrap {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {

      top: 0;
      z-index: 10;
      background: #080611f5;
      border-bottom: 1px solid var(--border);
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--cyan);
    }
